# The simulator is a static site: this server block serves the build in /usr/share/nginx/html, on the unprivileged
# port 8080. In the image it is /etc/nginx/conf.d/default.conf; with an nginx of your own, include it in `http`.

# No query string, referrer or cookie in the log: the access link carries its token in its query, and no
# log keeps it. The proxy in front of the container has its own log: keep the query out of that one too.
log_format notoken '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  access_log /dev/stdout notoken;
  error_log /dev/stderr warn;

  # The site is read, never written to.
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  # The build ships .gz files next to the originals (Dockerfile): served as they are, no CPU per request. The
  # others, and what the .gz files do not cover, are compressed on the fly.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/octet-stream;

  include /etc/nginx/snippets/security-headers.conf;

  # The probe of the container's healthcheck: not logged, no file behind it.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build output: a file never changes under its name. No `always` on the cache headers: they apply to a
  # successful answer only, so a 404 for a file that is not there yet is never kept by a cache.
  location ^~ /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The licenses: not hashed, so a short cache.
  location ~ ^/third-party-(licenses|notices)\.txt$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # No hidden file is served.
  location ~ /\. {
    return 404;
  }

  # The page itself: asked again every time, so a new build is seen at once.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
