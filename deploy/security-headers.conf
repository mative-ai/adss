# The response headers of the simulator. nginx.conf includes this file in the server block and in every location that
# sets a header of its own: nginx drops the inherited `add_header` lines in a location that has one.
# tools/deploy/headers.test.ts guards what follows.
#
# The Content-Security-Policy has no 'unsafe-inline', no 'unsafe-eval' and no 'wasm-unsafe-eval': the app runs no
# WebAssembly, and every script, style, font, model and worker is a file of its own origin. `data:` is
# there for the empty icon of index.html. The page is never embedded (frame-ancestors) and posts no form.
#
# No Strict-Transport-Security here: the container speaks plain HTTP behind the host's proxy, which ends TLS and sets
# it (deploy/README.md).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
